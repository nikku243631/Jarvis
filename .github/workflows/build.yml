
          name: Build Jarvis APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install required Android SDK packages
        run: |
          set -e
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Verify source archive
        run: |
          set -e
          test -f Jarvis-v0.1-source-final-v2.zip
          echo "Source archive found: Jarvis-v0.1-source-final-v2.zip"

      - name: Extract source
        run: |
          set -e
          rm -rf extracted
          mkdir -p extracted
          unzip -q Jarvis-v0.1-source-final-v2.zip -d extracted
          test -f extracted/Jarvis-v0.1/settings.gradle
          test -f extracted/Jarvis-v0.1/app/build.gradle
          test -f extracted/Jarvis-v0.1/app/src/main/AndroidManifest.xml
          echo "Android project structure verified."

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        working-directory: extracted/Jarvis-v0.1
        run: |
          set -e
          gradle --version
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Verify APK
        run: |
          set -e
          APK="extracted/Jarvis-v0.1/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          echo "APK created: $APK"
          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Jarvis-APK
          path: extracted/Jarvis-v0.1/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
